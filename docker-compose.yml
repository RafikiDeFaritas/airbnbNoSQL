services:
  redis:
    image: redis/redis-stack:latest
    container_name: airbnb-redis
    ports:
      - "6379:6379"   # Redis (RESP)
      - "8001:8001"   # RedisInsight (UI web)
    volumes:
      - redis-data:/data
    environment:
      - REDIS_ARGS=--save 60 1000 --appendonly yes
    restart: unless-stopped

volumes:
  redis-data:
